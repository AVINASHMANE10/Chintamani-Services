<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="fc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D4987"/>
      <stop offset="50%" stop-color="#48BFFF"/>
      <stop offset="100%" stop-color="#D6F1FF"/>
    </linearGradient>
    <linearGradient id="fc-building-main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="50%" stop-color="#4A6282"/>
      <stop offset="100%" stop-color="#1F3251"/>
    </linearGradient>
    <linearGradient id="fc-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#83D8FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#48BFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0D4987" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fc-glass-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF9FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#83D8FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="fc-building-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="100%" stop-color="#14213D"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#fc-sky)"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" fill-opacity="0.6">
    <ellipse cx="120" cy="180" rx="90" ry="16"/>
    <ellipse cx="180" cy="170" rx="60" ry="12"/>
    <ellipse cx="1050" cy="250" rx="100" ry="18"/>
    <ellipse cx="1120" cy="240" rx="60" ry="12"/>
    <ellipse cx="900" cy="120" rx="70" ry="14"/>
  </g>

  <!-- Distant city skyline -->
  <g fill="#1F3251" opacity="0.4">
    <rect x="0" y="560" width="80" height="140"/>
    <rect x="60" y="600" width="60" height="100"/>
    <rect x="110" y="540" width="45" height="160"/>
    <rect x="950" y="580" width="70" height="120"/>
    <rect x="1010" y="540" width="55" height="160"/>
    <rect x="1060" y="600" width="50" height="100"/>
    <rect x="1110" y="560" width="60" height="140"/>
    <rect x="1160" y="590" width="40" height="110"/>
  </g>

  <!-- Distant city building windows -->
  <g fill="#FCD34D" opacity="0.5">
    <rect x="20" y="600" width="4" height="4"/><rect x="35" y="600" width="4" height="4"/>
    <rect x="20" y="620" width="4" height="4"/><rect x="35" y="620" width="4" height="4"/>
    <rect x="20" y="640" width="4" height="4"/><rect x="35" y="640" width="4" height="4"/>
    <rect x="70" y="620" width="4" height="4"/><rect x="85" y="620" width="4" height="4"/>
    <rect x="70" y="640" width="4" height="4"/><rect x="85" y="640" width="4" height="4"/>
    <rect x="1020" y="580" width="4" height="4"/><rect x="1035" y="580" width="4" height="4"/>
    <rect x="1020" y="600" width="4" height="4"/><rect x="1035" y="600" width="4" height="4"/>
    <rect x="1120" y="610" width="4" height="4"/><rect x="1135" y="610" width="4" height="4"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="600" cy="740" rx="300" ry="20" fill="#0A1628" fill-opacity="0.4"/>

  <!-- ===== MAIN BUILDING ===== -->
  <g transform="translate(600 740)">
    <!-- Side face (perspective — left side going back) -->
    <path d="M -280 0 L -200 20 L -200 -680 L -280 -640 Z" fill="url(#fc-building-side)"/>

    <!-- Side face window lines -->
    <g stroke="#4A6282" stroke-width="1" opacity="0.6">
      <line x1="-275" y1="-600" x2="-205" y2="-630"/>
      <line x1="-275" y1="-540" x2="-205" y2="-580"/>
      <line x1="-275" y1="-480" x2="-205" y2="-530"/>
      <line x1="-275" y1="-420" x2="-205" y2="-480"/>
      <line x1="-275" y1="-360" x2="-205" y2="-430"/>
      <line x1="-275" y1="-300" x2="-205" y2="-380"/>
      <line x1="-275" y1="-240" x2="-205" y2="-330"/>
      <line x1="-275" y1="-180" x2="-205" y2="-280"/>
      <line x1="-275" y1="-120" x2="-205" y2="-230"/>
      <line x1="-275" y1="-60" x2="-205" y2="-180"/>
    </g>

    <!-- Main front facade -->
    <rect x="-200" y="-680" width="400" height="680" fill="url(#fc-building-main)"/>

    <!-- Window grid — dirty side (right 60%) -->
    <g>
      <!-- Row generator — 10 rows × 6 cols -->
      <g fill="url(#fc-glass)">
        <!-- Row 1 -->
        <rect x="-35" y="-660" width="50" height="55"/>
        <rect x="20" y="-660" width="50" height="55"/>
        <rect x="75" y="-660" width="50" height="55"/>
        <rect x="130" y="-660" width="50" height="55"/>
        <!-- Row 2 -->
        <rect x="-35" y="-600" width="50" height="55"/>
        <rect x="20" y="-600" width="50" height="55"/>
        <rect x="75" y="-600" width="50" height="55"/>
        <rect x="130" y="-600" width="50" height="55"/>
        <!-- Row 3 -->
        <rect x="-35" y="-540" width="50" height="55"/>
        <rect x="20" y="-540" width="50" height="55"/>
        <rect x="75" y="-540" width="50" height="55"/>
        <rect x="130" y="-540" width="50" height="55"/>
        <!-- Row 4 -->
        <rect x="-35" y="-480" width="50" height="55"/>
        <rect x="20" y="-480" width="50" height="55"/>
        <rect x="75" y="-480" width="50" height="55"/>
        <rect x="130" y="-480" width="50" height="55"/>
        <!-- Row 5 -->
        <rect x="-35" y="-420" width="50" height="55"/>
        <rect x="20" y="-420" width="50" height="55"/>
        <rect x="75" y="-420" width="50" height="55"/>
        <rect x="130" y="-420" width="50" height="55"/>
        <!-- Row 6 -->
        <rect x="-35" y="-360" width="50" height="55"/>
        <rect x="20" y="-360" width="50" height="55"/>
        <rect x="75" y="-360" width="50" height="55"/>
        <rect x="130" y="-360" width="50" height="55"/>
        <!-- Row 7 -->
        <rect x="-35" y="-300" width="50" height="55"/>
        <rect x="20" y="-300" width="50" height="55"/>
        <rect x="75" y="-300" width="50" height="55"/>
        <rect x="130" y="-300" width="50" height="55"/>
        <!-- Row 8 -->
        <rect x="-35" y="-240" width="50" height="55"/>
        <rect x="20" y="-240" width="50" height="55"/>
        <rect x="75" y="-240" width="50" height="55"/>
        <rect x="130" y="-240" width="50" height="55"/>
        <!-- Row 9 -->
        <rect x="-35" y="-180" width="50" height="55"/>
        <rect x="20" y="-180" width="50" height="55"/>
        <rect x="75" y="-180" width="50" height="55"/>
        <rect x="130" y="-180" width="50" height="55"/>
        <!-- Row 10 -->
        <rect x="-35" y="-120" width="50" height="55"/>
        <rect x="20" y="-120" width="50" height="55"/>
        <rect x="75" y="-120" width="50" height="55"/>
        <rect x="130" y="-120" width="50" height="55"/>
        <!-- Row 11 -->
        <rect x="-35" y="-60" width="50" height="55"/>
        <rect x="20" y="-60" width="50" height="55"/>
        <rect x="75" y="-60" width="50" height="55"/>
        <rect x="130" y="-60" width="50" height="55"/>
      </g>
    </g>

    <!-- CLEANED section (left column of windows, sparkling) -->
    <g fill="url(#fc-glass-clean)">
      <rect x="-195" y="-660" width="50" height="55"/>
      <rect x="-195" y="-600" width="50" height="55"/>
      <rect x="-195" y="-540" width="50" height="55"/>
      <rect x="-195" y="-480" width="50" height="55"/>
      <rect x="-140" y="-480" width="50" height="55"/>
      <rect x="-85" y="-480" width="50" height="55"/>
      <rect x="-195" y="-420" width="50" height="55"/>
      <rect x="-140" y="-420" width="50" height="55"/>
      <rect x="-85" y="-420" width="50" height="55"/>
    </g>

    <!-- Mid-row windows (partially cleaned/transition) -->
    <g fill="url(#fc-glass)" opacity="0.95">
      <rect x="-140" y="-660" width="50" height="55"/>
      <rect x="-85" y="-660" width="50" height="55"/>
      <rect x="-140" y="-600" width="50" height="55"/>
      <rect x="-85" y="-600" width="50" height="55"/>
      <rect x="-140" y="-540" width="50" height="55"/>
      <rect x="-85" y="-540" width="50" height="55"/>
    </g>

    <!-- Window highlight accents on clean side -->
    <g stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1">
      <line x1="-190" y1="-655" x2="-175" y2="-655"/>
      <line x1="-190" y1="-595" x2="-175" y2="-595"/>
      <line x1="-190" y1="-535" x2="-175" y2="-535"/>
      <line x1="-190" y1="-475" x2="-175" y2="-475"/>
    </g>

    <!-- Vertical mullions -->
    <g stroke="#050B16" stroke-width="1" opacity="0.7">
      <line x1="-145" y1="-680" x2="-145" y2="0"/>
      <line x1="-90" y1="-680" x2="-90" y2="0"/>
      <line x1="-35" y1="-680" x2="-35" y2="0"/>
      <line x1="20" y1="-680" x2="20" y2="0"/>
      <line x1="75" y1="-680" x2="75" y2="0"/>
      <line x1="130" y1="-680" x2="130" y2="0"/>
    </g>

    <!-- Horizontal floor lines -->
    <g stroke="#050B16" stroke-width="1" opacity="0.6">
      <line x1="-200" y1="-605" x2="200" y2="-605"/>
      <line x1="-200" y1="-545" x2="200" y2="-545"/>
      <line x1="-200" y1="-485" x2="200" y2="-485"/>
      <line x1="-200" y1="-425" x2="200" y2="-425"/>
      <line x1="-200" y1="-365" x2="200" y2="-365"/>
      <line x1="-200" y1="-305" x2="200" y2="-305"/>
      <line x1="-200" y1="-245" x2="200" y2="-245"/>
      <line x1="-200" y1="-185" x2="200" y2="-185"/>
      <line x1="-200" y1="-125" x2="200" y2="-125"/>
      <line x1="-200" y1="-65" x2="200" y2="-65"/>
    </g>

    <!-- Roof structure -->
    <rect x="-210" y="-700" width="420" height="20" fill="#050B16"/>
    <rect x="-190" y="-710" width="380" height="15" fill="#14213D"/>

    <!-- Antenna -->
    <rect x="-3" y="-760" width="6" height="60" fill="#34496A"/>
    <circle cx="0" cy="-770" r="6" fill="#F43F5E">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== ROPE ACCESS WORKER ===== -->
  <g transform="translate(520 360)">
    <!-- Rope from roof -->
    <line x1="0" y1="-280" x2="0" y2="-10" stroke="#FEF3C7" stroke-width="2"/>
    <line x1="25" y1="-280" x2="25" y2="-10" stroke="#FEF3C7" stroke-width="2"/>

    <!-- Worker body -->
    <g>
      <!-- Seat/harness -->
      <rect x="-20" y="0" width="55" height="18" rx="4" fill="#7F1D1D"/>
      <rect x="-15" y="-2" width="45" height="6" fill="#F43F5E"/>

      <!-- Body -->
      <rect x="-15" y="-40" width="40" height="45" rx="6" fill="#F59E0B"/>
      <rect x="-15" y="-30" width="40" height="5" fill="#FBBF24"/>
      <rect x="-15" y="-15" width="40" height="3" fill="#D97706" opacity="0.6"/>

      <!-- Head / helmet -->
      <circle cx="5" cy="-56" r="12" fill="#FFFFFF"/>
      <path d="M -7 -56 L 17 -56 L 17 -66 Q 17 -72, 5 -72 Q -7 -72, -7 -66 Z" fill="#FCD34D"/>
      <rect x="-7" y="-58" width="24" height="3" fill="#050B16"/>

      <!-- Arms - one holding squeegee -->
      <rect x="-20" y="-35" width="12" height="25" rx="3" fill="#F59E0B" transform="rotate(-20 -14 -25)"/>
      <rect x="20" y="-30" width="12" height="30" rx="3" fill="#F59E0B" transform="rotate(25 26 -15)"/>

      <!-- Squeegee -->
      <g transform="translate(38 -5) rotate(25)">
        <rect x="-2" y="-25" width="4" height="40" fill="#1F3251"/>
        <rect x="-18" y="-30" width="36" height="8" rx="2" fill="#4A6282"/>
        <rect x="-18" y="-24" width="36" height="3" fill="#48BFFF"/>
      </g>

      <!-- Legs -->
      <rect x="-10" y="15" width="13" height="35" rx="3" fill="#1F3251"/>
      <rect x="8" y="15" width="13" height="35" rx="3" fill="#1F3251"/>
      <rect x="-12" y="48" width="17" height="6" rx="1" fill="#050B16"/>
      <rect x="6" y="48" width="17" height="6" rx="1" fill="#050B16"/>

      <!-- Water spray effect -->
      <g fill="#B5E7FF" opacity="0.7">
        <circle cx="55" cy="-15" r="2">
          <animate attributeName="cx" values="45;65;45" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="58" cy="-8" r="1.5">
          <animate attributeName="cx" values="48;70;48" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="52" cy="0" r="2.5">
          <animate attributeName="cx" values="42;62;42" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Sparkle accents on clean windows -->
  <g fill="#FFFFFF">
    <g transform="translate(430 120)">
      <path d="M 0 -8 L 1.5 -1.5 L 8 0 L 1.5 1.5 L 0 8 L -1.5 1.5 L -8 0 L -1.5 -1.5 Z">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(450 200)">
      <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(425 300)">
      <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
