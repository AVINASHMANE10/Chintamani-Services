<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="sw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D4987"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <radialGradient id="sw-sun-glow" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sw-tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="20%" stop-color="#1F3251"/>
      <stop offset="50%" stop-color="#4A6282"/>
      <stop offset="80%" stop-color="#1F3251"/>
      <stop offset="100%" stop-color="#050B16"/>
    </linearGradient>
    <linearGradient id="sw-tube-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw-tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF5"/>
      <stop offset="40%" stop-color="#C9D5E3"/>
      <stop offset="100%" stop-color="#4A6282"/>
    </linearGradient>
    <linearGradient id="sw-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
  </defs>

  <!-- Sky gradient (warm sunset) -->
  <rect width="1200" height="800" fill="url(#sw-sky)"/>

  <!-- Sun glow -->
  <ellipse cx="260" cy="240" rx="600" ry="400" fill="url(#sw-sun-glow)"/>

  <!-- Sun rays -->
  <g stroke="#FEF3C7" stroke-opacity="0.4" stroke-linecap="round">
    <g transform="translate(240 220)">
      <line x1="0" y1="-180" x2="0" y2="-140" stroke-width="4"/>
      <line x1="130" y1="-130" x2="100" y2="-100" stroke-width="3"/>
      <line x1="180" y1="0" x2="140" y2="0" stroke-width="4"/>
      <line x1="-140" y1="-130" x2="-100" y2="-100" stroke-width="3"/>
      <line x1="-180" y1="0" x2="-140" y2="0" stroke-width="3"/>
      <line x1="130" y1="130" x2="100" y2="100" stroke-width="3"/>
      <line x1="0" y1="180" x2="0" y2="140" stroke-width="3"/>
      <line x1="-130" y1="130" x2="-100" y2="100" stroke-width="3"/>
      <!-- Diagonal rays -->
      <line x1="75" y1="-165" x2="60" y2="-130" stroke-width="2"/>
      <line x1="165" y1="-75" x2="130" y2="-60" stroke-width="2"/>
      <line x1="165" y1="75" x2="130" y2="60" stroke-width="2"/>
      <line x1="75" y1="165" x2="60" y2="130" stroke-width="2"/>
      <line x1="-75" y1="-165" x2="-60" y2="-130" stroke-width="2"/>
      <line x1="-165" y1="-75" x2="-130" y2="-60" stroke-width="2"/>
      <line x1="-165" y1="75" x2="-130" y2="60" stroke-width="2"/>
    </g>
  </g>

  <!-- Sun body -->
  <circle cx="240" cy="220" r="110" fill="#FEF3C7" opacity="0.95"/>
  <circle cx="240" cy="220" r="85" fill="#FCD34D"/>
  <circle cx="220" cy="200" r="35" fill="#FEF3C7" opacity="0.6"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <ellipse cx="600" cy="150" rx="100" ry="18"/>
    <ellipse cx="660" cy="135" rx="65" ry="13"/>
    <ellipse cx="920" cy="220" rx="80" ry="15"/>
    <ellipse cx="980" cy="210" rx="45" ry="10"/>
    <ellipse cx="1050" cy="130" rx="70" ry="13"/>
  </g>

  <!-- Birds -->
  <g fill="#14213D" opacity="0.5">
    <path d="M 720 270 Q 732 260, 744 270 Q 737 264, 744 258 Q 732 266, 720 270 Z"/>
    <path d="M 760 290 Q 770 282, 780 290 Q 774 285, 780 280 Q 770 288, 760 290 Z"/>
  </g>

  <!-- ===== ROOFTOP ===== -->
  <!-- Distant rooftops -->
  <g fill="#7F1D1D" opacity="0.4">
    <polygon points="0,600 60,550 120,600"/>
    <polygon points="140,620 180,580 220,620"/>
    <polygon points="1100,580 1150,535 1200,580 1200,620 1100,620"/>
  </g>

  <!-- Main roof (angled, shown at perspective) -->
  <path d="M 100 720 L 1100 720 L 1050 520 L 200 520 Z" fill="url(#sw-roof)"/>

  <!-- Roof tile texture -->
  <g stroke="#450A0A" stroke-opacity="0.4" stroke-width="1">
    <path d="M 160 620 L 1080 620"/>
    <path d="M 140 660 L 1090 660"/>
    <path d="M 130 690 L 1095 690"/>
    <!-- Vertical lines -->
    <path d="M 260 520 L 180 720"/>
    <path d="M 360 520 L 310 720"/>
    <path d="M 460 520 L 440 720"/>
    <path d="M 560 520 L 570 720"/>
    <path d="M 660 520 L 700 720"/>
    <path d="M 760 520 L 830 720"/>
    <path d="M 860 520 L 960 720"/>
    <path d="M 960 520 L 1090 720"/>
  </g>

  <!-- Roof ridge -->
  <rect x="180" y="515" width="880" height="10" fill="#450A0A"/>

  <!-- ===== SOLAR COLLECTOR STRUCTURE ===== -->
  <g transform="translate(600 600)">
    <!-- Support frame (back legs) -->
    <g stroke="#34496A" stroke-width="6" stroke-linecap="round">
      <line x1="-250" y1="30" x2="-280" y2="-40"/>
      <line x1="250" y1="30" x2="220" y2="-40"/>
      <line x1="-250" y1="30" x2="-220" y2="-40"/>
      <line x1="250" y1="30" x2="280" y2="-40"/>
    </g>

    <!-- Frame crossbar (back) -->
    <rect x="-290" y="-50" width="580" height="10" rx="3" fill="#4A6282"/>

    <!-- Evacuated tube rack angled -->
    <g transform="skewY(-12)">
      <!-- Lower manifold (header) -->
      <rect x="-260" y="0" width="520" height="30" rx="6" fill="#4A6282"/>
      <rect x="-255" y="3" width="510" height="6" fill="#6B85A3"/>

      <!-- Upper manifold -->
      <rect x="-260" y="-230" width="520" height="30" rx="6" fill="#6B85A3"/>
      <rect x="-255" y="-227" width="510" height="6" fill="#9AAFC5"/>

      <!-- Evacuated tubes (15 tubes) -->
      <g>
        <!-- Each tube is a vertical cylinder with sun glow -->
        <g>
          <rect x="-250" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-246" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-240" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-240" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-215" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-211" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-205" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-205" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-180" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-176" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-170" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-170" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-145" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-141" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-135" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-135" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-110" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-106" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-100" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-100" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-75" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-71" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-65" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-65" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-40" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-36" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="-30" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="-30" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="-5" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="-1" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="5" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="5" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="30" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="34" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="40" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="40" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="65" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="69" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="75" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="75" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="100" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="104" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="110" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="110" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="135" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="139" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="145" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="145" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="170" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="174" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="180" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="180" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="205" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="209" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="215" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="215" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
        <g>
          <rect x="240" y="-195" width="20" height="200" rx="10" fill="url(#sw-tube)"/>
          <rect x="244" y="-190" width="4" height="190" fill="url(#sw-tube-glow)" opacity="0.8"/>
          <ellipse cx="250" cy="-195" rx="10" ry="4" fill="#14213D"/>
          <ellipse cx="250" cy="5" rx="10" ry="4" fill="#050B16"/>
        </g>
      </g>
    </g>

    <!-- Water tank (horizontal cylinder) sits above tubes -->
    <g transform="translate(0 -280)">
      <!-- Tank shadow -->
      <ellipse cx="0" cy="60" rx="280" ry="10" fill="#0A1628" fill-opacity="0.3"/>

      <!-- Tank body -->
      <rect x="-270" y="0" width="540" height="60" rx="30" fill="url(#sw-tank)"/>

      <!-- Tank cap left -->
      <ellipse cx="-270" cy="30" rx="16" ry="30" fill="#4A6282"/>
      <ellipse cx="-266" cy="30" rx="14" ry="26" fill="#C9D5E3"/>
      <ellipse cx="-263" cy="30" rx="10" ry="20" fill="#E8EEF5"/>

      <!-- Tank cap right -->
      <ellipse cx="270" cy="30" rx="16" ry="30" fill="#4A6282"/>
      <ellipse cx="266" cy="30" rx="14" ry="26" fill="#C9D5E3"/>
      <ellipse cx="263" cy="30" rx="10" ry="20" fill="#E8EEF5"/>

      <!-- Top rim highlight -->
      <rect x="-260" y="2" width="520" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.6"/>

      <!-- Logo / brand strip -->
      <rect x="-80" y="20" width="160" height="18" rx="2" fill="#0D4987"/>
      <text x="0" y="33" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="3">SOLAR</text>

      <!-- Valve on top -->
      <rect x="-5" y="-15" width="10" height="18" fill="#4A6282"/>
      <circle cx="0" cy="-20" r="8" fill="#34496A"/>
      <rect x="-12" y="-22" width="24" height="4" rx="1" fill="#6B85A3"/>
    </g>
  </g>

  <!-- Hot water pipes coming down from tank and going to roof -->
  <g stroke="#DC2626" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 330 375 Q 310 440, 290 510 L 290 720"/>
  </g>
  <g stroke="#0D4987" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 870 375 Q 890 440, 910 510 L 910 720"/>
  </g>

  <!-- Pipe labels -->
  <g transform="translate(260 500)">
    <rect x="-30" y="-10" width="50" height="18" rx="2" fill="#DC2626"/>
    <text x="-5" y="3" fill="white" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HOT</text>
  </g>
  <g transform="translate(940 500)">
    <rect x="-20" y="-10" width="50" height="18" rx="2" fill="#0D4987"/>
    <text x="5" y="3" fill="white" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">COLD</text>
  </g>

  <!-- Small chimney/vent -->
  <g transform="translate(960 520)">
    <rect x="-15" y="-40" width="30" height="40" fill="#7F1D1D"/>
    <rect x="-18" y="-45" width="36" height="8" fill="#450A0A"/>
  </g>

  <!-- Sparkle/efficiency indicators -->
  <g fill="#FEF3C7">
    <g transform="translate(500 350)">
      <path d="M 0 -12 L 2.4 -2.4 L 12 0 L 2.4 2.4 L 0 12 L -2.4 2.4 L -12 0 L -2.4 -2.4 Z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(700 380)">
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(420 330)">
      <path d="M 0 -8 L 1.6 -1.6 L 8 0 L 1.6 1.6 L 0 8 L -1.6 1.6 L -8 0 L -1.6 -1.6 Z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
