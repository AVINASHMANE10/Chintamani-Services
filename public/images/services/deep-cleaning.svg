<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#E8F4F8"/>
    </linearGradient>
    <linearGradient id="dc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#E8EEF5"/>
    </linearGradient>
    <linearGradient id="dc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF5"/>
      <stop offset="100%" stop-color="#C9D5E3"/>
    </linearGradient>
    <linearGradient id="dc-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#B5E7FF"/>
      <stop offset="100%" stop-color="#EDF9FF"/>
    </linearGradient>
    <linearGradient id="dc-sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="dc-plant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="dc-pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="dc-lightray" cx="0.3" cy="0" r="0.7">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm interior background -->
  <rect width="1200" height="800" fill="url(#dc-bg)"/>

  <!-- Back wall -->
  <rect width="1200" height="600" fill="url(#dc-wall)"/>

  <!-- Sunlight ray from window -->
  <path d="M 180 0 L 450 0 L 650 600 L 100 600 Z" fill="url(#dc-lightray)" opacity="0.6"/>

  <!-- ===== WINDOW ===== -->
  <g transform="translate(300 300)">
    <!-- Window frame -->
    <rect x="-120" y="-180" width="240" height="280" rx="4" fill="#FFFFFF" stroke="#4A6282" stroke-width="3"/>
    <rect x="-115" y="-175" width="230" height="270" rx="2" fill="url(#dc-window)"/>

    <!-- Window cross -->
    <line x1="0" y1="-180" x2="0" y2="100" stroke="#4A6282" stroke-width="4"/>
    <line x1="-120" y1="-40" x2="120" y2="-40" stroke="#4A6282" stroke-width="4"/>

    <!-- Sun -->
    <circle cx="-70" cy="-120" r="28" fill="#FCD34D" opacity="0.9"/>
    <circle cx="-70" cy="-120" r="18" fill="#FEF3C7"/>

    <!-- Distant hills -->
    <path d="M -115 0 Q -60 -30, -10 -10 Q 50 -40, 115 -5 L 115 95 L -115 95 Z" fill="#14B8A6" opacity="0.6"/>
    <path d="M -115 20 Q -70 -10, -30 15 Q 30 -20, 115 10 L 115 95 L -115 95 Z" fill="#0F766E" opacity="0.5"/>

    <!-- Window sill -->
    <rect x="-135" y="95" width="270" height="14" fill="#F5F7FA"/>
    <rect x="-135" y="106" width="270" height="4" fill="#C9D5E3"/>
  </g>

  <!-- Wall art frame -->
  <g transform="translate(900 250)">
    <rect x="-80" y="-100" width="160" height="200" fill="#FFFFFF" stroke="#0A1628" stroke-width="4"/>
    <rect x="-70" y="-90" width="140" height="180" fill="#FEE2E2"/>
    <!-- Abstract art -->
    <circle cx="-20" cy="-40" r="35" fill="#F43F5E" opacity="0.8"/>
    <circle cx="30" cy="20" r="30" fill="#FCD34D" opacity="0.9"/>
    <path d="M -60 60 Q 0 30, 60 70" stroke="#0A1628" stroke-width="3" fill="none"/>
  </g>

  <!-- Small shelf + books -->
  <g transform="translate(1080 260)">
    <rect x="-45" y="-5" width="90" height="6" fill="#78350F"/>
    <!-- Books -->
    <rect x="-40" y="-50" width="14" height="45" fill="#DC2626"/>
    <rect x="-25" y="-60" width="12" height="55" fill="#0D4987"/>
    <rect x="-12" y="-45" width="10" height="40" fill="#F59E0B"/>
    <rect x="0" y="-55" width="13" height="50" fill="#047857"/>
    <rect x="15" y="-48" width="11" height="43" fill="#7F1D1D"/>
    <!-- Small decorative object -->
    <rect x="28" y="-25" width="14" height="20" fill="#4A6282"/>
    <circle cx="35" cy="-30" r="5" fill="#34496A"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="600" width="1200" height="200" fill="url(#dc-floor)"/>

  <!-- Floor reflection/shine -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1">
    <line x1="250" y1="620" x2="400" y2="620"/>
    <line x1="280" y1="640" x2="380" y2="640"/>
    <line x1="900" y1="650" x2="1000" y2="650"/>
  </g>

  <!-- ===== SOFA ===== -->
  <g transform="translate(700 600)">
    <!-- Sofa shadow -->
    <ellipse cx="0" cy="130" rx="210" ry="16" fill="#14213D" fill-opacity="0.15"/>

    <!-- Back cushions -->
    <rect x="-180" y="-120" width="360" height="100" rx="14" fill="url(#dc-sofa)"/>

    <!-- Seat cushions -->
    <rect x="-180" y="-40" width="360" height="70" rx="12" fill="url(#dc-sofa)"/>

    <!-- Division between cushions -->
    <line x1="-60" y1="-120" x2="-60" y2="30" stroke="#064E3B" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="-120" x2="60" y2="30" stroke="#064E3B" stroke-width="1" opacity="0.3"/>

    <!-- Arms -->
    <rect x="-200" y="-110" width="30" height="140" rx="8" fill="#0F766E"/>
    <rect x="170" y="-110" width="30" height="140" rx="8" fill="#0F766E"/>

    <!-- Highlights -->
    <rect x="-175" y="-115" width="350" height="8" rx="4" fill="#5EEAD4" opacity="0.6"/>
    <rect x="-175" y="-35" width="350" height="6" rx="3" fill="#5EEAD4" opacity="0.5"/>

    <!-- Legs -->
    <rect x="-170" y="30" width="6" height="25" fill="#0A1628"/>
    <rect x="-90" y="30" width="6" height="25" fill="#0A1628"/>
    <rect x="84" y="30" width="6" height="25" fill="#0A1628"/>
    <rect x="164" y="30" width="6" height="25" fill="#0A1628"/>

    <!-- Throw pillows -->
    <rect x="-150" y="-90" width="50" height="45" rx="6" fill="#FEF3C7" transform="rotate(-8 -125 -67)"/>
    <rect x="105" y="-90" width="45" height="45" rx="6" fill="#FCD34D" transform="rotate(5 127 -67)"/>
  </g>

  <!-- ===== FLOOR LAMP ===== -->
  <g transform="translate(980 620)">
    <!-- Base -->
    <ellipse cx="0" cy="10" rx="20" ry="5" fill="#1F3251"/>
    <rect x="-16" y="-2" width="32" height="8" rx="3" fill="#4A6282"/>

    <!-- Pole -->
    <rect x="-2" y="-250" width="4" height="250" fill="#34496A"/>

    <!-- Shade -->
    <path d="M -40 -320 L 40 -320 L 30 -255 L -30 -255 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <path d="M -38 -320 L 38 -320 L 35 -310 L -35 -310 Z" fill="#FCD34D"/>

    <!-- Glow -->
    <ellipse cx="0" cy="-250" rx="60" ry="30" fill="#FEF3C7" opacity="0.6"/>
  </g>

  <!-- ===== PLANT ===== -->
  <g transform="translate(480 660)">
    <!-- Pot -->
    <path d="M -40 60 L 40 60 L 35 0 L -35 0 Z" fill="url(#dc-pot)"/>
    <ellipse cx="0" cy="0" rx="35" ry="5" fill="#451A03"/>

    <!-- Leaves -->
    <g fill="url(#dc-plant)">
      <path d="M 0 -10 Q -40 -60, -30 -100 Q -5 -75, 0 -10 Z" transform="rotate(-10)"/>
      <path d="M 0 -10 Q 40 -70, 30 -120 Q 10 -80, 0 -10 Z" transform="rotate(10)"/>
      <path d="M 0 -10 Q -20 -90, -5 -140 Q 0 -80, 0 -10 Z"/>
      <path d="M 0 -10 Q 30 -90, 5 -150 Q 5 -80, 0 -10 Z" transform="rotate(5)"/>
      <path d="M 0 -10 Q -30 -50, -50 -75 Q -10 -55, 0 -10 Z" transform="rotate(-15)"/>
      <path d="M 0 -10 Q 35 -50, 55 -80 Q 15 -55, 0 -10 Z" transform="rotate(15)"/>
    </g>
    <!-- Leaf veins -->
    <g stroke="#064E3B" stroke-width="1" fill="none" opacity="0.6">
      <path d="M -3 -20 Q -15 -60, -25 -100"/>
      <path d="M 0 -20 Q 0 -70, 0 -140"/>
      <path d="M 3 -20 Q 15 -70, 25 -120"/>
    </g>
  </g>

  <!-- ===== COFFEE TABLE ===== -->
  <g transform="translate(550 680)">
    <ellipse cx="0" cy="55" rx="95" ry="10" fill="#14213D" fill-opacity="0.2"/>
    <rect x="-100" y="-5" width="200" height="15" rx="3" fill="#78350F"/>
    <rect x="-100" y="-8" width="200" height="5" rx="2" fill="#92400E"/>
    <rect x="-95" y="10" width="6" height="45" fill="#451A03"/>
    <rect x="89" y="10" width="6" height="45" fill="#451A03"/>

    <!-- Objects on table -->
    <!-- Book -->
    <rect x="-70" y="-18" width="60" height="16" rx="1" fill="#FFFFFF"/>
    <rect x="-70" y="-18" width="60" height="3" fill="#0D4987"/>
    <!-- Mug -->
    <rect x="10" y="-25" width="24" height="24" rx="2" fill="#FFFFFF"/>
    <rect x="32" y="-20" width="6" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="12" y="-23" width="20" height="4" fill="#78350F"/>
    <path d="M 15 -18 Q 22 -22, 28 -18" stroke="#C9D5E3" stroke-width="1" fill="none"/>
  </g>

  <!-- ===== SPARKLE ELEMENTS ===== -->
  <g fill="#FCD34D">
    <g transform="translate(200 200)">
      <path d="M 0 -20 L 4 -4 L 20 0 L 4 4 L 0 20 L -4 4 L -20 0 L -4 -4 Z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(1120 400)">
      <path d="M 0 -14 L 2.8 -2.8 L 14 0 L 2.8 2.8 L 0 14 L -2.8 2.8 L -14 0 L -2.8 -2.8 Z">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(150 450)">
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(1050 120)">
      <path d="M 0 -12 L 2.4 -2.4 L 12 0 L 2.4 2.4 L 0 12 L -2.4 2.4 L -12 0 L -2.4 -2.4 Z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Floor dust particles (bubbles) rising -->
  <g fill="#FCD34D" opacity="0.6">
    <circle cx="350" cy="680" r="3">
      <animate attributeName="cy" values="700;200;700" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="700" r="2">
      <animate attributeName="cy" values="720;150;720" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="680" r="2.5">
      <animate attributeName="cy" values="700;180;700" dur="11s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>
</svg>
