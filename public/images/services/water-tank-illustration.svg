<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="watery-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfecff"/>
      <stop offset="40%" stop-color="#a8dcff"/>
      <stop offset="100%" stop-color="#48bfff"/>
    </linearGradient>
    <linearGradient id="tank-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#0d6db8"/>
    </linearGradient>
    <linearGradient id="water-inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3dafc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5bb6ec" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="droplet-grad" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5bb6ec" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="ripple-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#0d6db8" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#watery-bg)"/>
  <rect width="1200" height="900" fill="url(#ripple-pattern)"/>

  <!-- Big background water wave -->
  <path d="M0 720 Q 200 660 400 720 T 800 720 T 1200 720 L 1200 900 L 0 900 Z" fill="#0d6db8" opacity="0.15"/>
  <path d="M0 760 Q 200 700 400 760 T 800 760 T 1200 760 L 1200 900 L 0 900 Z" fill="#0d6db8" opacity="0.2"/>
  <path d="M0 800 Q 200 740 400 800 T 800 800 T 1200 800 L 1200 900 L 0 900 Z" fill="#1183d2" opacity="0.3"/>

  <!-- Sun/halo behind tank -->
  <circle cx="600" cy="380" r="240" fill="#ffffff" opacity="0.3"/>

  <!-- Water tank illustration (cylindrical overhead tank, classic Sintex/blue type) -->
  <g transform="translate(600, 470)">
    <!-- Tank shadow -->
    <ellipse cx="0" cy="280" rx="220" ry="20" fill="#0a4373" opacity="0.2"/>

    <!-- Tank body -->
    <ellipse cx="0" cy="-180" rx="180" ry="40" fill="#1782c9"/>
    <rect x="-180" y="-180" width="360" height="380" fill="url(#tank-body)"/>
    <ellipse cx="0" cy="200" rx="180" ry="40" fill="#0a4373"/>

    <!-- Top cap highlight -->
    <ellipse cx="0" cy="-180" rx="180" ry="40" fill="url(#tank-body)" opacity="0.3"/>

    <!-- Tank ribs/lines -->
    <line x1="-180" y1="-100" x2="180" y2="-100" stroke="#0a4373" stroke-width="3" opacity="0.4"/>
    <line x1="-180" y1="-20" x2="180" y2="-20" stroke="#0a4373" stroke-width="3" opacity="0.4"/>
    <line x1="-180" y1="60" x2="180" y2="60" stroke="#0a4373" stroke-width="3" opacity="0.4"/>
    <line x1="-180" y1="140" x2="180" y2="140" stroke="#0a4373" stroke-width="3" opacity="0.4"/>

    <!-- Highlight on tank left -->
    <rect x="-180" y="-180" width="30" height="380" fill="#ffffff" opacity="0.18"/>

    <!-- Manhole on top -->
    <ellipse cx="0" cy="-220" rx="50" ry="14" fill="#0a4373"/>
    <ellipse cx="0" cy="-225" rx="50" ry="12" fill="#1782c9"/>

    <!-- "Water level" visible at top -->
    <ellipse cx="0" cy="-180" rx="170" ry="34" fill="url(#water-inside)"/>
    <ellipse cx="0" cy="-180" rx="170" ry="34" fill="none" stroke="#5bb6ec" stroke-width="2"/>

    <!-- Outlet pipe at base -->
    <rect x="160" y="160" width="80" height="20" fill="#0a4373"/>
    <rect x="220" y="155" width="20" height="30" fill="#0a4373"/>

    <!-- Brand label "PURE" -->
    <text x="0" y="40" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" opacity="0.85">PURE</text>
    <text x="0" y="80" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.75" letter-spacing="6">WATER</text>
  </g>

  <!-- Big water droplet (right side) -->
  <g transform="translate(900, 290)">
    <path d="M0 -80 C 40 -30 60 10 60 40 A 60 60 0 1 1 -60 40 C -60 10 -40 -30 0 -80 Z" fill="url(#droplet-grad)" />
    <ellipse cx="-20" cy="0" rx="14" ry="22" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Smaller droplet (left side) -->
  <g transform="translate(260, 380) scale(0.6)">
    <path d="M0 -80 C 40 -30 60 10 60 40 A 60 60 0 1 1 -60 40 C -60 10 -40 -30 0 -80 Z" fill="url(#droplet-grad)" />
    <ellipse cx="-20" cy="0" rx="14" ry="22" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Tiny droplets scattered -->
  <circle cx="180" cy="180" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="1040" cy="160" r="10" fill="#ffffff" opacity="0.65"/>
  <circle cx="1100" cy="500" r="6" fill="#ffffff" opacity="0.55"/>
  <circle cx="120" cy="600" r="7" fill="#ffffff" opacity="0.5"/>
  <circle cx="970" cy="650" r="9" fill="#ffffff" opacity="0.55"/>

  <!-- Water splash at base -->
  <g transform="translate(600, 720)">
    <path d="M-60 0 Q -50 -25 -30 -15 Q -10 -30 10 -15 Q 30 -30 50 -15 Q 70 -25 60 0 Z" fill="#ffffff" opacity="0.7"/>
    <circle cx="-80" cy="-10" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="80" cy="-10" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="-100" cy="5" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="100" cy="5" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
