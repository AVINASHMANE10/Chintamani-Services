<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="dwt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF9FF"/>
      <stop offset="60%" stop-color="#B5E7FF"/>
      <stop offset="100%" stop-color="#48BFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="dwt-tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D4987"/>
      <stop offset="30%" stop-color="#1EA0FF"/>
      <stop offset="70%" stop-color="#48BFFF"/>
      <stop offset="100%" stop-color="#0855AB"/>
    </linearGradient>
    <linearGradient id="dwt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#83D8FF"/>
      <stop offset="100%" stop-color="#0D4987"/>
    </linearGradient>
    <radialGradient id="dwt-sun" cx="0.1" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFAEB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFAEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dwt-droplet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5E7FF"/>
      <stop offset="100%" stop-color="#0080F5"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="800" fill="url(#dwt-sky)"/>

  <!-- Sun glow -->
  <circle cx="180" cy="160" r="420" fill="url(#dwt-sun)"/>

  <!-- Sun rays -->
  <g stroke="#FFFAEB" stroke-opacity="0.35" stroke-linecap="round" stroke-width="1.5">
    <line x1="180" y1="40" x2="200" y2="120"/>
    <line x1="80" y1="160" x2="160" y2="180"/>
    <line x1="100" y1="280" x2="180" y2="240"/>
    <line x1="280" y1="260" x2="220" y2="220"/>
    <line x1="300" y1="120" x2="240" y2="160"/>
  </g>

  <!-- Cloud wisps -->
  <g fill="#FFFFFF" fill-opacity="0.7">
    <ellipse cx="900" cy="120" rx="100" ry="20"/>
    <ellipse cx="950" cy="100" rx="70" ry="14"/>
    <ellipse cx="1050" cy="220" rx="80" ry="16"/>
  </g>

  <!-- Horizon line / rooftop edge -->
  <path d="M0 620 L1200 620 L1200 800 L0 800 Z" fill="#0A1628" fill-opacity="0.06"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#0A1628" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Distant building silhouettes -->
  <g fill="#0A1628" fill-opacity="0.08">
    <rect x="50" y="540" width="80" height="80"/>
    <rect x="145" y="560" width="60" height="60"/>
    <rect x="1000" y="530" width="100" height="90"/>
    <rect x="1115" y="555" width="55" height="65"/>
  </g>

  <!-- Main water tank: base platform -->
  <ellipse cx="600" cy="615" rx="240" ry="18" fill="#0A1628" fill-opacity="0.15"/>
  <rect x="440" y="570" width="320" height="50" rx="4" fill="#1F3251"/>
  <rect x="450" y="570" width="300" height="10" fill="#34496A"/>

  <!-- Tank body -->
  <g transform="translate(600 350)">
    <!-- Shadow on ground -->
    <ellipse cx="0" cy="220" rx="200" ry="12" fill="#0A1628" fill-opacity="0.15"/>

    <!-- Tank main cylinder -->
    <path d="M -200 -80 Q -200 -120 -180 -130 L 180 -130 Q 200 -120 200 -80 L 200 200 Q 200 230 180 240 L -180 240 Q -200 230 -200 200 Z"
          fill="url(#dwt-tank)"/>

    <!-- Vertical highlight on left -->
    <path d="M -185 -100 Q -190 -110 -180 -115 L -170 -115 Q -165 -110 -170 -100 L -170 220 Q -165 230 -175 230 L -185 230 Q -195 220 -190 215 Z"
          fill="#B5E7FF" fill-opacity="0.5"/>

    <!-- Horizontal ridge lines (Sintex-style) -->
    <g stroke="#0D4987" stroke-opacity="0.4" stroke-width="1.5">
      <line x1="-198" y1="-50" x2="198" y2="-50"/>
      <line x1="-198" y1="-10" x2="198" y2="-10"/>
      <line x1="-198" y1="30" x2="198" y2="30"/>
      <line x1="-198" y1="70" x2="198" y2="70"/>
      <line x1="-198" y1="110" x2="198" y2="110"/>
      <line x1="-198" y1="150" x2="198" y2="150"/>
      <line x1="-198" y1="190" x2="198" y2="190"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1">
      <line x1="-198" y1="-48" x2="198" y2="-48"/>
      <line x1="-198" y1="-8" x2="198" y2="-8"/>
      <line x1="-198" y1="32" x2="198" y2="32"/>
      <line x1="-198" y1="72" x2="198" y2="72"/>
      <line x1="-198" y1="112" x2="198" y2="112"/>
      <line x1="-198" y1="152" x2="198" y2="152"/>
      <line x1="-198" y1="192" x2="198" y2="192"/>
    </g>

    <!-- Tank top cap (dome) -->
    <ellipse cx="0" cy="-130" rx="200" ry="40" fill="url(#dwt-top)"/>
    <ellipse cx="0" cy="-140" rx="180" ry="30" fill="#83D8FF" fill-opacity="0.4"/>
    <ellipse cx="-60" cy="-150" rx="70" ry="10" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- Manhole cover on top -->
    <ellipse cx="0" cy="-155" rx="40" ry="12" fill="#14213D"/>
    <ellipse cx="0" cy="-158" rx="36" ry="10" fill="#1F3251"/>
    <rect x="-20" y="-164" width="40" height="4" rx="2" fill="#34496A"/>

    <!-- Inlet pipe on top -->
    <rect x="75" y="-200" width="18" height="60" rx="3" fill="#4A6282"/>
    <rect x="73" y="-200" width="22" height="8" rx="2" fill="#6B85A3"/>
    <circle cx="84" cy="-175" r="10" fill="#0D4987"/>
    <circle cx="84" cy="-175" r="5" fill="#48BFFF"/>

    <!-- Outlet valve -->
    <rect x="-40" y="210" width="80" height="28" rx="3" fill="#4A6282"/>
    <rect x="-30" y="215" width="60" height="3" fill="#6B85A3"/>
    <circle cx="0" cy="260" r="14" fill="#34496A"/>
    <rect x="-3" y="238" width="6" height="24" fill="#1F3251"/>
    <path d="M -10 260 L 10 260 M 0 250 L 0 270" stroke="#6B85A3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Water droplet falling from valve -->
  <g transform="translate(600 680)">
    <path d="M 0 -15 C 0 -15, -10 -5, -10 5 C -10 10.5, -5.5 15, 0 15 C 5.5 15, 10 10.5, 10 5 C 10 -5, 0 -15, 0 -15 Z"
          fill="url(#dwt-droplet)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 30; 0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="-3" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Ripple rings -->
  <g transform="translate(600 740)" fill="none" stroke="#1EA0FF" stroke-opacity="0.4" stroke-width="1.5">
    <ellipse rx="20" ry="4">
      <animate attributeName="rx" values="8; 60; 8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="2; 12; 2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6; 0; 0.6" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="40" ry="8">
      <animate attributeName="rx" values="20; 80; 20" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="4; 16; 4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4; 0; 0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Sparkle stars -->
  <g fill="#FFFFFF">
    <g transform="translate(250 200)">
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(900 300)">
      <path d="M 0 -7 L 1.5 -1.5 L 7 0 L 1.5 1.5 L 0 7 L -1.5 1.5 L -7 0 L -1.5 -1.5 Z">
        <animate attributeName="opacity" values="0.5; 1; 0.5" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(350 380)">
      <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z">
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(1050 450)">
      <path d="M 0 -8 L 1.5 -1.5 L 8 0 L 1.5 1.5 L 0 8 L -1.5 1.5 L -8 0 L -1.5 -1.5 Z">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
