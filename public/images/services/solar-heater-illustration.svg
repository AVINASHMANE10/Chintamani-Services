<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="sky-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b3"/>
      <stop offset="40%" stop-color="#ffd479"/>
      <stop offset="80%" stop-color="#a8dcff"/>
      <stop offset="100%" stop-color="#48bfff"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="60%" stop-color="#ffc94d"/>
      <stop offset="100%" stop-color="#ff8f1c"/>
    </radialGradient>
    <linearGradient id="tank-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#a8b7c8"/>
    </linearGradient>
    <linearGradient id="tube-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a2330"/>
    </linearGradient>
    <pattern id="dot-pattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.2" fill="#0d6db8" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="900" fill="url(#sky-bg)"/>
  <rect width="1200" height="900" fill="url(#dot-pattern)"/>

  <!-- Sun with rays -->
  <g transform="translate(900, 220)">
    <!-- Long rays -->
    <g stroke="#ff9d2e" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="-180" x2="0" y2="-130"/>
      <line x1="127" y1="-127" x2="92" y2="-92"/>
      <line x1="180" y1="0" x2="130" y2="0"/>
      <line x1="127" y1="127" x2="92" y2="92"/>
      <line x1="0" y1="180" x2="0" y2="130"/>
      <line x1="-127" y1="127" x2="-92" y2="92"/>
      <line x1="-180" y1="0" x2="-130" y2="0"/>
      <line x1="-127" y1="-127" x2="-92" y2="-92"/>
    </g>
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="140" fill="#fff" opacity="0.25"/>
    <circle cx="0" cy="0" r="110" fill="#fff" opacity="0.3"/>
    <!-- Sun -->
    <circle cx="0" cy="0" r="85" fill="url(#sun-grad)"/>
    <circle cx="-20" cy="-20" r="30" fill="#fff" opacity="0.4"/>
  </g>

  <!-- Solar heater on roof -->
  <g transform="translate(600, 580)">
    <!-- Roof/base support -->
    <rect x="-280" y="120" width="560" height="80" fill="#7a8898" opacity="0.5"/>
    <rect x="-280" y="180" width="560" height="20" fill="#5a6878" opacity="0.6"/>

    <!-- Tank (horizontal cylinder) -->
    <ellipse cx="-200" cy="-100" rx="40" ry="80" fill="url(#tank-grad)"/>
    <rect x="-200" y="-180" width="400" height="160" fill="url(#tank-grad)"/>
    <ellipse cx="200" cy="-100" rx="40" ry="80" fill="#c5d1e0"/>
    <ellipse cx="200" cy="-100" rx="30" ry="60" fill="#a8b7c8" opacity="0.7"/>

    <!-- Tank highlight -->
    <rect x="-200" y="-180" width="400" height="20" fill="#ffffff" opacity="0.4"/>

    <!-- Tank top fitting -->
    <rect x="-30" y="-200" width="60" height="20" fill="#5a6878"/>
    <rect x="-10" y="-220" width="20" height="20" fill="#5a6878"/>

    <!-- Frame angle support -->
    <line x1="-220" y1="-20" x2="-260" y2="120" stroke="#5a6878" stroke-width="6"/>
    <line x1="220" y1="-20" x2="260" y2="120" stroke="#5a6878" stroke-width="6"/>

    <!-- Evacuated tubes -->
    <g>
      <!-- Tube row -->
      <rect x="-220" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="-180" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="-140" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="-100" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="-60" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="-20" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="20" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="60" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="100" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="140" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>
      <rect x="180" y="20" width="20" height="180" fill="url(#tube-grad)" rx="10"/>

      <!-- Tube highlights -->
      <rect x="-215" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="-175" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="-135" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="-95" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="-55" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="-15" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="25" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="65" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="105" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="145" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
      <rect x="185" y="30" width="3" height="160" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Manifold at top of tubes -->
    <rect x="-235" y="0" width="470" height="30" fill="#3a4858" rx="6"/>
    <rect x="-235" y="0" width="470" height="6" fill="#5a6878" rx="3"/>
  </g>

  <!-- Steam/heat lines from tank -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6">
    <path d="M380 350 Q 390 320 380 290 Q 370 260 380 230"/>
    <path d="M440 360 Q 450 330 440 300 Q 430 270 440 240"/>
    <path d="M500 350 Q 510 320 500 290 Q 490 260 500 230"/>
  </g>

  <!-- Small water droplets -->
  <circle cx="150" cy="200" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="350" r="8" fill="#ffffff" opacity="0.55"/>
  <circle cx="220" cy="450" r="5" fill="#ffffff" opacity="0.5"/>
  <circle cx="1080" cy="500" r="7" fill="#ffffff" opacity="0.5"/>

  <!-- Bottom horizon waves -->
  <path d="M0 800 Q 200 770 400 800 T 800 800 T 1200 800 L 1200 900 L 0 900 Z" fill="#0d6db8" opacity="0.2"/>
  <path d="M0 830 Q 200 810 400 830 T 800 830 T 1200 830 L 1200 900 L 0 900 Z" fill="#1183d2" opacity="0.3"/>
</svg>
